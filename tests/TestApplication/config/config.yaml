imports:
    - { resource: "@TmonierSyliusQuoteRequestPlugin/config/config.yaml" }
    - { resource: "fake_quote_pdf.php" }

parameters:
    # Functional tests switch guests off by booting a kernel with this variable set to 0.
    env(TMONIER_QUOTE_ALLOW_GUESTS): '1'

tmonier_sylius_quote_request:
    # Every test runs inside a transaction: level 1 is "no transaction".
    transaction_baseline: 1
    allow_guests: '%env(bool:TMONIER_QUOTE_ALLOW_GUESTS)%'
    rate_limit:
        cache_pool: cache.tmonier_quote_request_limiter
    customer_group_discounts:
        retail: 5
        wholesale: 12.5

framework:
    cache:
        pools:
            # Filesystem (an array pool is reset between requests); cleared by every functional test.
            cache.tmonier_quote_request_limiter:
                adapter: cache.adapter.filesystem

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

# Demo quote requests in every status (dev and test databases).
sylius_fixtures:
    suites:
        default:
            fixtures:
                tmonier_quote_request:
                    priority: -100
                    options:
                        amount: 8
