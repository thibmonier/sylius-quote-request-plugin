tmonier_quote_request_shop_new:
    path: /quote-request
    methods: [GET, POST]
    defaults:
        _controller: tmonier_quote_request.controller.shop.create::newAction

tmonier_quote_request_shop_basket_add:
    path: /quote-request/products/{productId}
    methods: [POST]
    requirements:
        productId: '\d+'
    defaults:
        _controller: tmonier_quote_request.controller.shop.basket::addToBasketAction

tmonier_quote_request_shop_from_cart:
    path: /quote-request/from-cart
    methods: [POST]
    defaults:
        _controller: tmonier_quote_request.controller.shop.basket::fromCartAction

tmonier_quote_request_shop_release_cart:
    path: /quote-request/release-cart
    methods: [POST]
    defaults:
        _controller: tmonier_quote_request.controller.shop.conversation::releaseCartAction

tmonier_quote_request_shop_show_by_token:
    path: /quotes/{token}
    methods: [GET]
    requirements:
        token: '[A-Za-z0-9_-]{20,64}'
    defaults:
        _controller: tmonier_quote_request.controller.shop.show::showByTokenAction

tmonier_quote_request_shop_transition:
    path: /quotes/{token}/{action}
    methods: [POST]
    requirements:
        token: '[A-Za-z0-9_-]{20,64}'
        action: 'accept|decline|cancel'
    defaults:
        _controller: tmonier_quote_request.controller.shop.conversation::transitionAction

tmonier_quote_request_shop_message:
    path: /quotes/{token}/message
    methods: [POST]
    requirements:
        token: '[A-Za-z0-9_-]{20,64}'
    defaults:
        _controller: tmonier_quote_request.controller.shop.conversation::messageAction

tmonier_quote_request_shop_checkout:
    path: /quotes/{token}/checkout
    methods: [POST]
    requirements:
        token: '[A-Za-z0-9_-]{20,64}'
    defaults:
        _controller: tmonier_quote_request.controller.shop.conversation::checkoutAction

tmonier_quote_request_shop_account_index:
    path: /account/quotes
    methods: [GET]
    defaults:
        _controller: tmonier_quote_request.controller.shop.show::accountIndexAction

tmonier_quote_request_shop_account_show:
    path: /account/quotes/{number}
    methods: [GET]
    requirements:
        number: '[A-Za-z0-9_-]{1,32}'
    defaults:
        _controller: tmonier_quote_request.controller.shop.show::accountShowAction

tmonier_quote_request_shop_pdf:
    path: /quotes/{token}/pdf
    methods: [GET]
    requirements:
        token: '[A-Za-z0-9_-]{20,64}'
    defaults:
        _controller: tmonier_quote_request.controller.shop.show::pdfAction
