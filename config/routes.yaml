# Import this file from your application's config/routes:
#
# tmonier_sylius_quote_request:
#     resource: "@TmonierSyliusQuoteRequestPlugin/config/routes.yaml"

tmonier_quote_request_admin:
    resource: "@TmonierSyliusQuoteRequestPlugin/config/routes/admin.yaml"
    prefix: '/%sylius_admin.path_name%'

tmonier_quote_request_shop:
    resource: "@TmonierSyliusQuoteRequestPlugin/config/routes/shop.yaml"
    prefix: /{_locale}
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$
