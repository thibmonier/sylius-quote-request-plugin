                template: '@SyliusAdmin/shared/crud/common/content/flashes.html.twig'
                priority: 200
            header:
                template: '@SyliusAdmin/shared/crud/common/content/header.html.twig'
                priority: 100
            sections:
                template: '@TmonierSyliusQuoteRequestPlugin/admin/quote_request/show/sections.html.twig'
                priority: 0

        'tmonier_quote_request.admin.quote_request.show.content.header':
