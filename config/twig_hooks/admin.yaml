sylius_twig_hooks:
    hooks:
        'tmonier_quote_request.admin.quote_request.show':
            sidebar:
                template: '@SyliusAdmin/shared/crud/common/sidebar.html.twig'
                priority: 200
            navbar:
                template: '@SyliusAdmin/shared/crud/common/navbar.html.twig'
                priority: 100
            content:
                template: '@SyliusAdmin/shared/crud/common/content.html.twig'
                priority: 0

        'tmonier_quote_request.admin.quote_request.show.content':
